upstream app {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        include fastcgi_params;

        fastcgi_pass app;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}
