<div id="songs-form" class="container-fluid">
    <div class="row">
        <div class="col-sm-7">
            <div class="input-group">
                <input type="text" spellcheck="false" autocomplete="off" id="song-url1" placeholder="Song URL" aria-label="Song URL"
                    class="form-control song-url" />
            </div>
        </div>
        <div class="col-sm-5">
            <div class="input-group">
                <input type="text" spellcheck="false" autocomplete="off" placeholder="Name" aria-label="Song name"
                    class="form-control song-name" />
            </div>
        </div>
    </div>
</div>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <button type="button" id="add-song" class="btn btn-link"><i class="fa fa-plus" aria-hidden="true"></i> Add another song</button>
        </div>
    </div>
</div>
