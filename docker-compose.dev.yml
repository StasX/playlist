name: playlist-tests

services:
  database:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: test-root-password
      MARIADB_DATABASE: playlist_test
      MARIADB_USER: playlist
      MARIADB_PASSWORD: password
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./infra/testing/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      start_period: 10s
      retries: 30

  tests:
    build:
      context: .
      dockerfile: infra/testing/Dockerfile
    working_dir: /app
    environment:
      APP_ENV: testing
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: playlist_test
      DB_USERNAME: playlist
      DB_PASSWORD: password
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
    depends_on:
      database:
        condition: service_healthy
    tmpfs:
      - /app/storage/infection
    volumes:
      - ./backend:/app
      - test-vendor:/app/vendor
      - ./infra/testing/run-tests.sh:/usr/local/bin/run-tests:ro
    entrypoint: [sh, /usr/local/bin/run-tests]
    command: [all]

volumes:
  test-vendor:
