# Local Jenkins controller; access through kubectl port-forward.
fullnameOverride: jenkins

controller:
  serviceType: ClusterIP
  servicePort: 8080
  targetPort: 8080
  numExecutors: 0
  cloudName: kubernetes
  admin:
    username: admin
    # The chart generates the password in a Kubernetes Secret.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Both bootstrap scripts load the versioned plugin inventory from plugins.yaml.
  JCasC:
    # casc/jenkins.yaml provides security, Kubernetes cloud and controller settings.
    # Enabling defaults as well would introduce duplicate JCasC keys.
    defaultConfig: false
  ingress:
    enabled: false

persistence:
  enabled: true
  size: 8Gi
  # Use the cluster's default StorageClass.

rbac:
  create: true

serviceAccount:
  create: true
