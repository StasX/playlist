<div id="player-container" class="container">
    <div class="row">
        <div class="col-sm-4 col-xs-4">
            <!-- Wrap img and button in a relative container -->
            <div class="album-cover">
                <img width="200" height="200" alt="album">
                <button id="play-pause" class="btn btn-orange">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>
        </div>
        <div class="col-sm-8 col-xs-8 container">
            <div class="row">
                <div class="col">
                    <div class="container audio-wrapper">
                        <div class="row">
                            <div class="col">
                                <i id="audio-play-pause" class="fa-solid fa-play"></i>
                            </div>
                            <div class="col">
                                <input type="range" id="tracker" class="slider" step="1"/>
                            </div>
                            <div class="col">
                                <span id="duration"></span>
                            </div>
                            <div class="col">
                                <div class="container">
                                    <div class="row">
                                        <div class="col">
                                            <i id="mute" class="fa-solid fa-volume-high"></i>
                                        </div>
                                        <div class="col">
                                            <input type="range" id="vol" class="slider" step="0.1" min="0" max="1" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <h5></h5>
            </div>
            <div class="row">
                <ol></ol>
            </div>
        </div>
    </div>
</div>
